name: bot-ofertas

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos: atiende tus comandos del chat (la búsqueda va cada 60 min, ver config.json)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para guardar state.json en el repositorio

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Guardar la memoria del bot (state.json)
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "actualizar memoria del bot" && git push)
